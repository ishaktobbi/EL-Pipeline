version: 2

semantic_models:
  - name: sem_dim_payment_methods
    model: ref('dim_payment_methods')
    description: "Semantic model for NYC taxi trip payment methods."

    entities:
      - name: payment_type
        type: primary
        expr: payment_type_id

    # -----------------------------------------------------------
    # DIMENSIONS: The attributes users can group or filter by
    # -----------------------------------------------------------
    
    dimensions:
      - name: payment_method
        type: categorical
        expr: payment_method

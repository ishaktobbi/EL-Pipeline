semantic_models:
  - name: sem_dim_vendors
    model: ref('dim_vendors')
    description: "Dimension model for taxi trip vendors."
    
    entities:
      - name: vendor
        type: primary
        expr: vendor_id

    # -----------------------------------------------------------
    # DIMENSIONS: The attributes users can group or filter by
    # -----------------------------------------------------------

    dimensions:
      - name: vendor_name
        type: categorical
        # 🟢 THIS IS THE KEY: Wrap the column in COALESCE with your default text
        expr: "COALESCE(vendor_name, 'not specified in lkp file')"

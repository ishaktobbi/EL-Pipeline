semantic_models:
  - name: sem_dim_locations
    model: ref('dim_locations')
    description: "Semantic model for NYC taxi trip pickup locations."

    entities:
      - name: location
        type: primary
        expr: location_id

    # -----------------------------------------------------------
    # DIMENSIONS: The attributes users can group or filter by
    # -----------------------------------------------------------
    dimensions:
      - name: borough
        type: categorical
        expr: borough          # Physical column in dim_locations table

      - name: zone
        type: categorical
        expr: zone             # Physical column in dim_locations table

      - name: service_zone
        type: categorical
        expr: service_zone
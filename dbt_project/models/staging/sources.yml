version: 2

# sources.yml checks the data before your code runs (Testing the Ingestion from the external source).

sources:
  - name: gcp_raw_lake       # ◄ The internal nickname of the table source
    database: elpipeline # ◄ the actual Google Cloud Project ID
    schema: ishak_tobbi_dataset # ◄  BigQuery dataset name which contains the raw data tables
    
    tables:
      - name: external_yellow_tripdata # ◄ The actual raw table name in the BigQuery (inside the dataset)
        description: "Raw table containing taxi events and user activity tracked from our application."

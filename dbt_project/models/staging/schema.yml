version: 2

# schema.yml checks the data after your code runs before passing it to the marts model (Testing your SQL Logic from the staging model).

models:
  - name: stg_data
    description: "staging dbt model that transforms raw data into a more structured format for analysis."
    columns:
      - name: vendor_id
        description: "The primary key for this table"
        data_tests:
          # - unique
          - not_null


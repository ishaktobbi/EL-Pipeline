version: 2

# schema.yml checks the data after your code runs (Testing your SQL Logic from the model).

models:
  - name: stg_data
    description: "staging dbt model that transforms raw data into a more structured format for analysis."
    columns:
      - name: vendor_id
        description: "The primary key for this table"
        data_tests:
          - unique
          - not_null


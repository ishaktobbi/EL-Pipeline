version: 2

models:
  - name: metricflow_time_spine
    description: "Daily time spine used by MetricFlow for time-series aggregation."
    
    # ⬇️ 1. Configures this model as the official MetricFlow time spine
    time_spine:
      standard_granularity_column: date_day

    # ⬇️ 2. Defines the base column and its daily granularity
    columns:
      - name: date_day
        description: "The base date column."
        granularity: day